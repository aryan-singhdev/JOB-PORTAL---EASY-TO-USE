{% extends "base.html" %}
{% block title %}Login - Job Portal{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4">
        <h3 class="text-center mb-1">🎯 JobMatch</h3>
        <p class="text-center text-muted mb-4">Find jobs from top platforms matched to your resume</p>
        <h5 class="mb-3">Log in</h5>
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" name="email" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
